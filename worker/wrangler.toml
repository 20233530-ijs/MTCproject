name = "mtc-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# KV 네임스페이스 바인딩 (Cloudflare 대시보드에서 생성 후 ID 교체)
[[kv_namespaces]]
binding = "MTC_METADATA"
id = "PLACEHOLDER_KV_NAMESPACE_ID"
preview_id = "PLACEHOLDER_KV_PREVIEW_ID"

# 환경변수 (Cloudflare 대시보드 또는 wrangler secret으로 설정)
# [vars]
# WORKERS_API_KEY = "PLACEHOLDER"  # 실제 키는 wrangler secret put 사용

# 배포 라우트 (Cloudflare Pages와 동일 계정 사용)
# routes = [
#   { pattern = "mtc-api.your-account.workers.dev", zone_name = "" }
# ]
